<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Carrick Games</title>
  <meta name="description" content="A little space to play. Discover 28 thoughtfully crafted browser games at Carrick Games. 简单好玩的在线游戏，随时开始。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230d9488' d='M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
  <div id="gameApp" class="game-app">
    <main>
      <div class="game-layout" id="gameLayout">
        <div class="game-center">
          <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="gameCanvas" width="400" height="500">Your browser does not support the game canvas. / 当前浏览器不支持游戏画布。</canvas>
            <div class="loading-overlay" id="loadingOverlay">
              <div class="spinner" id="loadingSpinner"></div>
              <div class="load-error" id="loadError" hidden>
                <div id="loadErrorMessage"></div>
                <button class="quiet-button" id="retryLoadBtn" type="button">Retry</button>
              </div>
            </div>
            <button class="start-overlay" id="startOverlay" type="button">
              <span class="start-overlay-title"></span>
              <span class="start-overlay-hint"></span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <div class="header-actions">
      <button class="game-menu-trigger game-help-trigger" id="helpBtn" type="button" aria-label="Controls" title="Controls (?)" aria-controls="helpOverlay" aria-expanded="false" aria-keyshortcuts="Shift+/"><span aria-hidden="true">?</span></button>
      <button class="game-menu-trigger" id="overflowBtn" type="button" aria-label="Game menu" aria-haspopup="dialog" aria-controls="overflowMenu" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h12"/></svg>
      </button>
      <button class="shell-backdrop" id="shellBackdrop" type="button" tabindex="-1" aria-label="Close game menu" hidden></button>
      <section class="overflow-menu" id="overflowMenu" role="dialog" aria-modal="true" aria-labelledby="gameMenuTitle" tabindex="-1" hidden>
        <header class="app-header">
          <span class="wordmark" id="gameMenuTitle">Carrick<span class="wordmark-secondary"> Games</span></span>
          <button class="dialog-close" id="menuCloseBtn" type="button" aria-label="Close menu"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
        </header>
        <button class="game-picker-trigger" id="gamePickerBtn" type="button" aria-haspopup="dialog" aria-controls="gameLibrary" aria-expanded="false" aria-keyshortcuts="Control+k Meta+k">
          <svg class="picker-grid" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/></svg>
          <span class="selected-game-label" id="selectedGameLabel">Select a game</span>
          <kbd class="picker-shortcut" id="pickerShortcut" aria-hidden="true">Ctrl K</kbd>
        </button>
        <button class="menu-action" id="restartBtn" type="button" hidden>Restart</button>
        <button class="menu-action" id="demoBtn" type="button" hidden>Demo</button>
        <aside class="game-context" id="statsPanel" hidden></aside>
        <div class="menu-section">
          <div class="menu-label" id="languageMenuLabel">Language</div>
          <div class="menu-options" aria-labelledby="languageMenuLabel">
            <button class="lang-btn" data-lang="en" type="button">English</button>
            <button class="lang-btn" data-lang="zh" type="button">中文</button>
          </div>
        </div>
        <div class="menu-section">
          <div class="menu-label" id="themeMenuLabel">Theme</div>
          <div class="menu-options" aria-labelledby="themeMenuLabel">
            <button class="theme-btn" data-set="light" type="button">Light</button>
            <button class="theme-btn" data-set="dark" type="button">Dark</button>
            <button class="theme-btn" data-set="system" type="button">System</button>
          </div>
        </div>
      </section>
    </div>

    <button class="guide-backdrop" id="guideBackdrop" type="button" tabindex="-1" aria-label="Close controls" hidden></button>
    <aside class="help-overlay" id="helpOverlay" role="region" aria-labelledby="helpTitle" aria-describedby="helpGameName" hidden>
      <div class="help-heading">
        <div><h2 id="helpTitle">Controls</h2><p id="helpGameName"></p></div>
        <button class="dialog-close" id="helpCloseBtn" type="button" aria-label="Close controls">×</button>
      </div>
      <div class="guide-body" id="guideBody" tabindex="0">
        <div class="input-map" id="keyboardPanel" aria-label="Keyboard and mouse mapping"></div>
        <div id="touchHelp"></div>
        <div class="guide-notes" id="guideNotes"></div>
      </div>
    </aside>

    <div class="game-library" id="gameLibrary" aria-hidden="true">
      <button class="library-backdrop" type="button" data-library-close aria-label="Close game library"></button>
      <section class="library-dialog" role="dialog" aria-modal="true" aria-labelledby="libraryHeadingTitle" tabindex="-1">
        <div class="library-dialog-header">
          <div class="library-title">
            <h1 id="libraryHeadingTitle">Games</h1>
            <p id="librarySummary">Choose what to play.</p>
          </div>
          <label class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.35-4.35"></path></svg>
            <input type="search" id="searchInput" aria-label="Search games / 搜索游戏" placeholder="Search games" autocomplete="off" spellcheck="false" aria-controls="gameList">
          </label>
          <button class="dialog-close" id="libraryCloseBtn" type="button" aria-label="Close"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
        </div>
        <div class="game-list" id="gameList"></div>
        <footer class="library-footer">
          <span class="library-result-count" id="libraryResultCount" role="status" aria-live="polite" aria-atomic="true"></span>
          <span class="library-keyboard-hints" id="libraryKeyboardHints"></span>
        </footer>
      </section>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
