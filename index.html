<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrick Games</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2339C5BB' d='M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z'/%3E%3C/svg%3E">
  <script>
    // Apply the saved style mode before first paint to avoid a mode flash.
    (function(){try{if(localStorage.getItem('cg-style-mode')==='pixel')document.documentElement.setAttribute('data-style-mode','pixel');}catch(e){}})();
  </script>
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-controls="gameLibrary" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12h18M3 6h18M3 18h18"/>
    </svg>
  </button>
  <aside class="main-sidebar" id="gameLibrary">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
      </svg>
      <span class="brand-text">Carrick Games</span>
      <button class="brand-toggle" id="sidebarToggleBtn" aria-label="Toggle sidebar">
        <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/>
        </svg>
        <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <path d="M13 17l5-5-5-5M6 17l5-5-5-5"/>
        </svg>
      </button>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M21 21l-4.35-4.35"></path>
      </svg>
      <input type="text" id="searchInput" aria-label="Search games / 搜索游戏" placeholder="Search games / 搜索游戏">
    </div>

    <div class="library-heading">
      <div class="library-heading-title" id="libraryHeadingTitle">Game Library</div>
      <div class="library-summary" id="librarySummary"></div>
    </div>
    <nav class="category-filters" id="categoryFilters" aria-label="Game categories / 游戏分类"></nav>
    <div class="game-list" id="gameList"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="topbar-context">
        <span class="library-eyebrow" id="libraryEyebrow">GAME LIBRARY · 25</span>
        <strong class="selected-game-label" id="selectedGameLabel">Select a game</strong>
      </div>
      <div class="topbar-settings">
        <div class="style-switch" aria-label="Style / 风格">
          <button class="style-btn" data-mode="modern" aria-label="Modern style / 现代风格" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
              <path d="M12 3l2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4z"/>
            </svg>
          </button>
          <button class="style-btn" data-mode="pixel" aria-label="Pixel style / 像素风格" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z"/>
            </svg>
          </button>
        </div>
        <div class="lang-switch" aria-label="Language">
          <button class="lang-btn" data-lang="en">En</button>
          <button class="lang-btn" data-lang="zh">中</button>
        </div>
        <div class="theme-switch" aria-label="Theme">
          <button class="theme-btn" data-set="light" aria-label="Light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
          </button>
          <button class="theme-btn" data-set="dark" aria-label="Dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
          </button>
          <button class="theme-btn" data-set="system" aria-label="System">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 3v18"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="game-layout" id="gameLayout">
      <aside class="game-sidebar stats-panel" id="statsPanel"></aside>

      <div class="game-center">
        <div class="game-meta" hidden>
          <h2 id="gameTitle">—</h2>
          <p id="gameDesc"></p>
        </div>
        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="gameCanvas" width="400" height="500">Your browser does not support the game canvas. / 当前浏览器不支持游戏画布。</canvas>
          <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner" id="loadingSpinner"></div>
            <div class="load-error" id="loadError" hidden>
              <div id="loadErrorMessage"></div>
              <button class="btn btn-secondary" id="retryLoadBtn" type="button">Retry</button>
            </div>
          </div>
          <div class="start-overlay" id="startOverlay">
            <div class="start-overlay-title"></div>
            <div class="start-overlay-hint"></div>
          </div>
          <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>
        </div>
        <div class="action-bar">
          <button class="btn btn-primary" id="actionBtn">Start Game</button>
          <button class="btn btn-secondary" id="demoBtn" hidden>Demo</button>
        </div>
      </div>

      <aside class="game-sidebar keyboard-panel" id="keyboardPanel"></aside>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
