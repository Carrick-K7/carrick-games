name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      game_ids:
        description: Game IDs to unlist, separated by whitespace or commas
        required: true
        type: string

permissions:
  contents: read

env:
  CI: true
  RELEASE_SHA: ${{ github.sha }}

defaults:
  run:
    shell: bash

# There is deliberately no workflow-wide concurrency or all-games-success gate.
# Only the same component queues behind itself; the server provides final CAS.
jobs:
  unlist:
    name: Owner-requested game unlist
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Carrick-K7/carrick-games' && github.repository_owner == 'Carrick-K7' &&
      github.ref == 'refs/heads/main' && github.actor == 'Carrick-K7' &&
      github.triggering_actor == 'Carrick-K7' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Local unlist notice (public SSH 2222 retired)
        env:
          GAME_IDS: ${{ inputs.game_ids }}
        run: |
          echo "Public SSH 2222 deployment is retired. Run locally on OrangeVPS:"
          echo "  carrick-publish-games --unlist ${GAME_IDS}"
          exit 1

  plan:
    name: Select affected releases
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      games: ${{ steps.plan.outputs.games }}
      shell: ${{ steps.plan.outputs.shell }}
      shell_publish: ${{ steps.plan.outputs.shell_publish }}
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify release selection and contracts
        run: node --test tests/release/*.test.mjs
      - name: Pin production state and select workspaces
        id: plan
        run: node scripts/ci.mjs plan
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: .ci/plan.json
          overwrite: true
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  common:
    name: Verify actual shared changes or initial source store
    needs: plan
    if: github.event_name != 'workflow_dispatch' && needs.plan.outputs.full == 'true'
    # Locked Playwright supports 24.04; ubuntu-latest can now select unsupported 26.04.
    runs-on: ubuntu-24.04
    # Full suite: 46.5 min on run 44917285119, 55:50 and still running when the
    # 3300s verify bound fired on run 44969213021. Budget the observed worst case.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .ci
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium webkit
      - name: Typecheck, build, unit and full browser suite
        run: timeout -k 10 4200 node scripts/ci.mjs verify all
      - name: Preserve failed shared browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-attempt-${{ github.run_attempt }}-failure
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: verified-source-store
          path: |
            dist/
            .ci/full-verified.json
          overwrite: true
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  games:
    name: Game ${{ matrix.id }}
    needs: [plan, common]
    if: >-
      always() && github.event_name != 'workflow_dispatch' && needs.plan.result == 'success' && needs.plan.outputs.games == 'true' &&
      (needs.common.result == 'success' || needs.common.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: carrick-games-${{ github.ref }}-${{ matrix.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .ci
      - if: needs.plan.outputs.full == 'true'
        uses: actions/download-artifact@v4
        with:
          name: verified-source-store
          path: .
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify candidate with pinned published counterparts
        run: timeout -k 10 7200 node scripts/ci.mjs verify '${{ matrix.id }}'
      - name: Ready for local publish (public SSH 2222 retired)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.publish
        run: |
          echo "CI verified '${{ matrix.id }}' at ${RELEASE_SHA}. Public SSH 2222 is retired."
          echo "Publish locally on OrangeVPS with: carrick-publish-games '${{ matrix.id }}'"
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.id }}-attempt-${{ github.run_attempt }}-failure
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore

  shell:
    name: Shell with currently published games
    needs: [plan, common]
    if: >-
      always() && github.event_name != 'workflow_dispatch' && needs.plan.result == 'success' && needs.plan.outputs.shell == 'true' &&
      needs.plan.outputs.bootstrap != 'true' &&
      (needs.common.result == 'success' || needs.common.result == 'skipped')
    runs-on: ubuntu-24.04
    concurrency:
      group: carrick-games-${{ github.ref }}-shell
      cancel-in-progress: false
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .ci
      - if: needs.plan.outputs.full == 'true'
        uses: actions/download-artifact@v4
        with:
          name: verified-source-store
          path: .
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium webkit
      - run: timeout -k 10 7200 node scripts/ci.mjs verify shell
      - name: Ready for local publish (public SSH 2222 retired)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.shell_publish == 'true'
        run: |
          echo "CI verified shell at ${RELEASE_SHA}. Public SSH 2222 is retired."
          echo "Publish locally on OrangeVPS with: carrick-publish-games shell"

  bootstrap-shell:
    name: Initial shell cutover after every game is seeded
    needs: [plan, common, games]
    if: >-
      always() && github.event_name != 'workflow_dispatch' && needs.plan.result == 'success' && needs.plan.outputs.bootstrap == 'true' &&
      needs.plan.outputs.shell == 'true' && needs.common.result == 'success' &&
      (needs.games.result == 'success' || (github.event_name == 'pull_request' && needs.games.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    concurrency:
      group: carrick-games-${{ github.ref }}-shell
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-source-store
          path: .
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium webkit
      - run: timeout -k 10 7200 node scripts/ci.mjs verify shell
      - name: Ready for local bootstrap shell publish (public SSH 2222 retired)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.shell_publish == 'true'
        run: |
          echo "CI verified bootstrap shell at ${RELEASE_SHA}. Public SSH 2222 is retired."
          echo "Publish locally on OrangeVPS with: carrick-publish-games shell"
