name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: carrick-games-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Package release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp index.html release/
          cp -R dist release/dist
          if [ -d fonts ]; then
            cp -R fonts release/fonts
          fi
          node -e 'require("fs").writeFileSync("release/manifest.json", JSON.stringify({ schemaVersion: 1, revision: process.env.RELEASE_SHA }, null, 2) + "\n")'
          test "$(node -p 'require("./release/manifest.json").revision')" = "$RELEASE_SHA"
          tar -C release -czf release.tar.gz .
          tar -tzf release.tar.gz

      - name: Upload release artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: carrick-games-release
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: carrick-games-release

      - name: Verify deployment secrets
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$DEPLOY_URL"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Deploy release atomically
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail

          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "deploy $RELEASE_ID" < release.tar.gz

          curl --fail --silent --show-error --location "$DEPLOY_URL/" --output /tmp/carrick-games-index.html
          curl --fail --silent --show-error --location "$DEPLOY_URL/dist/main.js?v=8" --output /dev/null

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
